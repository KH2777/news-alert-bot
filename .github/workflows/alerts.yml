name: Market event alerts

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: market-alerts
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check calendar & send alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DISPLAY_TZ: ${{ vars.DISPLAY_TZ || 'Europe/London' }}
          LEAD_MINUTES: ${{ vars.LEAD_MINUTES || '60' }}
          FINAL_MINUTES: ${{ vars.FINAL_MINUTES || '15' }}
          MIN_LEVEL: ${{ vars.MIN_LEVEL || '2' }}
          DIGEST_HOUR: ${{ vars.DIGEST_HOUR || '7' }}
          EVENING_HOUR: ${{ vars.EVENING_HOUR || '21' }}
          QUIET_HOURS: ${{ vars.QUIET_HOURS || '0-7' }}
          TRUMP_SENSITIVE: ${{ vars.TRUMP_SENSITIVE || '1' }}
          TRUTH_ENABLED: ${{ vars.TRUTH_ENABLED || '1' }}
          TRUTH_MIN_LEVEL: ${{ vars.TRUTH_MIN_LEVEL || '2' }}
          PRICE_ALERTS: ${{ vars.PRICE_ALERTS || '1' }}
          PRICE_SENSITIVITY: ${{ vars.PRICE_SENSITIVITY || '1.0' }}
          REPORT_MIN_LEVEL: ${{ vars.REPORT_MIN_LEVEL || '2' }}
          WEEKLY_DAY: ${{ vars.WEEKLY_DAY || '6' }}
          WEEKLY_HOUR: ${{ vars.WEEKLY_HOUR || '18' }}
        run: python bot.py
      - name: Save state
        if: always()
        run: |
          if ! git diff --quiet state.json; then
            git config user.name "alert-bot"
            git config user.email "alert-bot@users.noreply.github.com"
            git add state.json
            git commit -m "state: update [skip ci]" -q
            git pull --rebase -q || true
            git push -q
          fi
